<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Mẫu B - Chọn cỡ bánh cho món</title><link rel="stylesheet" href="chung.css">
<style>
.hd{background:var(--do);padding:72px 72px 0;height:420px;color:var(--kem)}
.hd .logo{width:280px;height:auto}
.hd .nhan{color:var(--vang);margin-top:64px}
.hd .h1{font-size:84px;margin-top:14px}
.bd{flex:1;padding:36px 72px 0;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;gap:48px;height:168px;border-bottom:2px solid rgba(35,23,22,.15)}
.row:last-of-type{border-bottom:0}
.rows{display:flex;flex-direction:column}
.cir{flex:none;border-radius:50%;background:#fff;border:6px solid var(--do);color:var(--do);font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center;margin-left:0}
.rows .row{padding-left:0}
.colc{width:168px;display:flex;justify-content:center;flex:none}
.cm{font-weight:800;font-size:58px;line-height:1.1}
.mon{font-weight:600;font-size:32px;margin-top:4px}
.note{padding-top:14px;font-weight:400;font-size:26px;line-height:1.4;padding-bottom:20px}
.ft{background:var(--do);height:130px;padding:0 72px;display:flex;align-items:center;justify-content:space-between;color:var(--kem);font-weight:800;font-size:38px}
.ft .logo{height:70px;width:auto}
</style></head><body>
<div class="slide" id="s">
<div class="hd"><img class="logo" src="../nhan-dien/logo/logo-ngang-kem.png" alt="Ẩm Thực An Tâm"><div class="nhan">Chọn cỡ bánh</div><div class="h1">Đúng cỡ cho đúng món</div></div>
<div class="bd"><div class="rows"><div class="row"><div class="colc"><div class="cir" style="width:120px;height:120px">22</div></div><div class="tx"><div class="cm">22 cm</div><div class="mon">Món cuốn nhỏ, taco, phần ăn nhẹ</div></div></div><div class="row"><div class="colc"><div class="cir" style="width:136px;height:136px">25</div></div><div class="tx"><div class="cm">25 cm</div><div class="mon">Wrap suất vừa</div></div></div><div class="row"><div class="colc"><div class="cir" style="width:152px;height:152px">28</div></div><div class="tx"><div class="cm">28 cm</div><div class="mon">Wrap đầy nhân, burrito</div></div></div><div class="row"><div class="colc"><div class="cir" style="width:168px;height:168px">31</div></div><div class="tx"><div class="cm">31 cm</div><div class="mon">Burrito lớn, phần cuốn nhiều nhân</div></div></div></div>
<div class="note">Cả 3 dòng tươi · nướng · nguyên cám có đủ 4 cỡ, 15 chiếc/túi.</div></div>
<div class="ft"><span>Nhắn Zalo: 0398 431 300</span></div>
</div></body></html>
