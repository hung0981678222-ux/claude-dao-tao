<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads - 1080x1080</title><style>:root{--ink:#262524;--clay:#C96442;--clayl:#F6E3DB;--clayd:#993C1D;--teal:#1F6F6B;--teall:#DDEEEC;--teald:#085041;--amb:#BA7517;--ambl:#FAEEDA;--ambd:#633806;--red:#A32D2D;--redl:#FCEBEB;--tint:#F3F1EE;--mute:#5F5E5A;--line:#D3D1C7;--bg:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:#8a8883}
body{font-family:"Calibri","Segoe UI","Liberation Sans","DejaVu Sans",system-ui,sans-serif;color:var(--ink)}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Liberation Serif","DejaVu Serif",serif;font-weight:700;margin:0;letter-spacing:-.5px}
p{margin:0}
.frame{position:relative;width:1080px;overflow:hidden;background:var(--tint);padding:72px 72px 64px;display:flex;flex-direction:column}
.f1350{height:1350px}.f1080{height:1080px}
.bar{position:absolute;left:0;top:0;width:100%;height:16px;background:var(--clay)}
.pill{display:inline-block;align-self:flex-start;font-weight:700;font-size:30px;padding:10px 26px;border-radius:40px;background:var(--clayl);color:var(--clayd)}
.pill.teal{background:var(--teall);color:var(--teald)}
.foot{margin-top:auto;font-size:25px;line-height:1.35;color:var(--mute);border-top:2px solid var(--line);padding-top:20px}
.foot b{color:var(--ink)}
.card{border-radius:28px;padding:32px 38px}
.num{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;font:700 36px/64px Cambria,Georgia,"Liberation Serif",serif;text-align:center;flex:none}

.frame{padding:64px}
h1{font-size:92px;line-height:1.08;margin:30px 0 30px}
h1 em{font-style:normal;color:var(--clayd)}
.grid{display:flex;gap:18px}
.grid div{flex:1;border-radius:22px;padding:34px 22px;font-size:40px;font-weight:700;line-height:1.2}
.grid small{display:block;font-size:28px;font-weight:400;margin-top:6px}
.h{background:var(--clayl);color:var(--clayd)}.l{background:var(--teall);color:var(--teald)}.a{background:var(--ambl);color:var(--ambd)}
.btn{margin-top:44px;background:var(--clay);color:#fff;border-radius:20px;padding:20px 32px;font-size:38px;font-weight:700;align-self:flex-start}
.frame .foot{font-size:23px;padding-top:16px}
</style></head><body><div class="frame f1080"><div class="bar"></div>
<span class="pill">Khoá cho dân văn phòng</span>
<h1>Giao việc rõ, kiểm tra kỹ. <em>Dùng Claude yên tâm hơn.</em></h1>
<div class="grid"><div class="h">Hiểu<small>Claude và từng nút</small></div><div class="l">Làm<small>Công thức 5 dòng</small></div><div class="a">An toàn<small>Cho phép hay Từ chối</small></div></div>
<div class="btn">Nhắn tin nhận khoá · [LINK ĐĂNG KÝ]</div>
<div class="foot" style="margin-top:auto">8 phần, 100 slide, có bài tập. Giá [GIÁ].<br>Khoá học độc lập, không phải sản phẩm chính thức của Anthropic.</div>
</div></body></html>
