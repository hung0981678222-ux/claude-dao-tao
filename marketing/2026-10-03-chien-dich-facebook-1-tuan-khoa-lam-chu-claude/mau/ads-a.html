<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads A - 1080x1080</title><style>:root{--ink:#262524;--clay:#C96442;--clayl:#F6E3DB;--clayd:#993C1D;--teal:#1F6F6B;--teall:#DDEEEC;--teald:#085041;--amb:#BA7517;--ambl:#FAEEDA;--ambd:#633806;--red:#A32D2D;--redl:#FCEBEB;--tint:#F3F1EE;--mute:#5F5E5A;--line:#D3D1C7;--bg:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:#8a8883}
body{font-family:"Calibri","Segoe UI","Liberation Sans","DejaVu Sans",system-ui,sans-serif;color:var(--ink)}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Liberation Serif","DejaVu Serif",serif;font-weight:700;margin:0;letter-spacing:-.5px}
p{margin:0}
.frame{position:relative;width:1080px;overflow:hidden;background:var(--tint);padding:72px 72px 64px;display:flex;flex-direction:column}
.f1350{height:1350px}.f1080{height:1080px}
.bar{position:absolute;left:0;top:0;width:100%;height:16px;background:var(--clay)}
.pill{display:inline-block;align-self:flex-start;font-weight:700;font-size:30px;padding:10px 26px;border-radius:40px;background:var(--clayl);color:var(--clayd)}
.pill.teal{background:var(--teall);color:var(--teald)}
.foot{margin-top:auto;font-size:25px;line-height:1.35;color:var(--mute);border-top:2px solid var(--line);padding-top:20px}
.foot b{color:var(--ink)}
.card{border-radius:28px;padding:32px 38px}
.num{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;font:700 36px/64px Cambria,Georgia,"Liberation Serif",serif;text-align:center;flex:none}



.frame{padding:64px}
.body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:28px 0 26px}
h1{font-size:98px;line-height:1.06}
h1 em{font-style:normal;color:var(--clayd)}
h1 em{white-space:nowrap}
.sub{font-size:48px;font-weight:700;line-height:1.25}
.grid{display:flex;gap:18px}
.grid div{flex:1;border-radius:22px;padding:34px 22px;font-size:46px;font-weight:700;line-height:1.2}
.grid small{display:block;font-size:30px;font-weight:400;margin-top:8px}
.h{background:var(--clayl);color:var(--clayd)}.l{background:var(--teall);color:var(--teald)}.a{background:var(--ambl);color:var(--ambd)}
.two{display:flex;gap:18px}
.two div{flex:1;border-radius:22px;padding:30px 28px;font-size:34px;line-height:1.25}
.two b{display:block;font-family:Cambria,Georgia,"Liberation Serif",serif;font-size:50px;margin-bottom:6px}
.ok{background:var(--teall);color:var(--teald);border-left:12px solid var(--teal)}.no{background:var(--redl);color:#791F1F;border-left:12px solid var(--red)}
.ex1{background:var(--teall);border-left:12px solid var(--teal);border-radius:22px;padding:30px 32px;color:var(--teald);font-size:34px;line-height:1.3}
.ex1 b{display:block;font-family:Cambria,Georgia,"Liberation Serif",serif;font-size:42px;line-height:1.2;color:var(--ink);margin-top:6px}
.frame .foot{font-size:25px;padding-top:16px;margin-top:0}
</style></head><body><div class="frame f1080" id="f"><div class="bar"></div><span class="pill">Khoá cho dân văn phòng</span><div class="body"><h1>Claude: nhân viên mới <em>rất nhanh</em></h1><p class="sub">Giao việc rõ, kiểm tra kỹ.</p><div class="grid"><div class="h">Hiểu<small>Claude và từng nút</small></div><div class="l">Làm<small>Công thức 5 dòng</small></div><div class="a">An toàn<small>Cho phép hay Từ chối</small></div></div></div><div class="foot"><b>Khoá “Làm chủ Claude trong công việc”</b> · 8 phần, 100 slide, có bài tập<br>Khoá do [ĐƠN VỊ] biên soạn, không phải sản phẩm chính thức của Anthropic.</div></div></body></html>
