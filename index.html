<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Làm chủ Claude</title>
<style>
:root{--deck:#262524;--ink:#262524;--clay:#C96442;--clayl:#F6E3DB;--clayd:#993C1D;--teal:#1F6F6B;--teall:#DDEEEC;--teald:#085041;--amb:#BA7517;--ambl:#FAEEDA;--ambd:#633806;--red:#A32D2D;--redl:#FCEBEB;--redd:#791F1F;--tint:#F3F1EE;--mute:#5F5E5A;--line:#D3D1C7;--bg:#fff}
*{box-sizing:border-box}body{margin:0;padding-inline:0;font:16px/1.55 "Calibri","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0;font-weight:700}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
header .t{font-family:Cambria,Georgia,serif;font-weight:700;font-size:15px;margin-right:auto}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--tint)}button.on{background:var(--clayl);border-color:var(--clay);color:var(--clayd)}
#bar{height:4px;background:var(--tint)}#bar i{display:block;height:100%;background:var(--clay);width:0}
main{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
.kick{font-size:13px;font-weight:700;color:var(--clay);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.sub{color:var(--mute);margin:4px 0 18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{border-radius:12px;padding:16px 18px;background:var(--tint)}
.card h3{font-size:18px;margin-bottom:8px}.card ul{margin:0;padding-left:20px}.card li{margin:5px 0}
.clay{background:var(--clayl)}.clay h3{color:var(--clayd)}.teal{background:var(--teall)}.teal h3{color:var(--teald)}
.amber{background:var(--ambl)}.amber h3{color:var(--ambd)}.red{background:var(--redl)}.red h3{color:var(--redd)}.gray h3{color:var(--ink)}
.n{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--clay);color:#fff;font-weight:700;font-size:14px;flex:none}
.rows{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:10px;padding:10px 14px}.row b{min-width:150px}.row span.d{color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}.row{flex-wrap:wrap}.row b{min-width:0}}
.q{font-family:Cambria,Georgia,serif;font-size:24px;font-weight:700;margin:6px 0 16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:17px;background:var(--tint);border:2px solid transparent;border-radius:12px;padding:14px 16px;margin:10px 0}
.opt.ok{background:var(--teall);border-color:var(--teal)}.opt.no{background:var(--redl);border-color:var(--red)}
.why{display:none;background:var(--ambl);border-radius:12px;padding:14px 16px;margin-top:12px}.why.show{display:block}
.mock{background:var(--tint);border-radius:12px;padding:14px}.win{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.dots{display:flex;gap:6px;margin-bottom:8px;align-items:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots span{margin-left:auto;font-size:12px;color:var(--mute)}
.chip{border:1px solid var(--line);background:var(--tint);color:var(--mute);border-radius:9px;padding:10px 12px;margin:8px 0}.chip.hi{background:var(--clayl);border:2px solid var(--clay);color:var(--clayd);font-weight:700}
.field{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;margin:10px 0}.field b{padding-top:8px}
textarea{width:100%;font:inherit;border:1.5px dashed var(--teal);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical}
.hint{display:none;margin-top:6px;background:var(--teall);border-radius:8px;padding:6px 10px;font-size:15px}.hint.show{display:block}
.bad{background:var(--redl);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.cover,.div{background:var(--deck);color:#fff;border-radius:16px;padding:44px 36px}.cover h1{font-size:46px;line-height:1.1;margin:10px 0 14px}.cover .k{color:var(--clay);font-weight:700;letter-spacing:.08em;font-size:13px}
.bub{max-width:420px;border-radius:18px;padding:14px 18px;margin:10px 0}.bub.u{background:var(--clay)}.bub.a{background:#3A3936;color:#E6E4DC}
.div h2{font-size:38px;margin:14px 0 8px}.div .num{width:64px;height:64px;font-size:30px}.div p{color:#D3D1C7;font-size:19px}
.acard{cursor:pointer;background:var(--tint);border-radius:12px;padding:16px;border:2px solid transparent}.acard:hover{border-color:var(--clay)}.acard b{display:block;margin:10px 0 2px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:14px;padding:10px}
nav .pg{min-width:110px;text-align:center;color:var(--mute);font-size:14px}
#toc{display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);padding:20px;overflow:auto}#toc.show{display:block}
#toc .box{background:var(--bg);border-radius:14px;max-width:760px;margin:0 auto;padding:18px 20px}#toc a{display:block;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}#toc a:hover{background:var(--tint)}#toc h3{margin:14px 0 4px;font-size:16px;color:var(--clayd)}
.note{font-size:14px;color:var(--mute)}
[contenteditable=true]{outline:2px dashed var(--teal);outline-offset:4px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ECEAE4;--bg:#1C1B1A;--tint:#2A2927;--mute:#B4B2A9;--line:#403E3B;--clayl:#4A2C22;--clayd:#F0B49F;--teall:#173B39;--teald:#8ED1C6;--teal:#4DB3A9;--ambl:#48350F;--ambd:#F0C77E;--redl:#4A2020;--redd:#F2A5A5;--red:#E06B6B;}}
:root[data-theme="dark"]{--ink:#ECEAE4;--bg:#1C1B1A;--tint:#2A2927;--mute:#B4B2A9;--line:#403E3B;--clayl:#4A2C22;--clayd:#F0B49F;--teall:#173B39;--teald:#8ED1C6;--teal:#4DB3A9;--ambl:#48350F;--ambd:#F0C77E;--redl:#4A2020;--redd:#F2A5A5;--red:#E06B6B;}
body{background:var(--bg);color:var(--ink);font-size:16px}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
</style>

 return '<h2>'+E(s.title)+'</h2><p class="sub">'+E(s.sub||'')+'</p><div class="grid g2">'+c(s.a,'red')+c(s.b,'teal')+'</div>'},
feature(s){const m=s.mock;const box=(h,t,k)=>'<div class="card '+k+'"><h3 style="font-size:16px">'+h+'</h3><p style="margin:0">'+E(t)+'</p></div>';
 return '<h2>'+E(s.title)+'</h2><p class="sub">'+E(s.sub||'')+'</p><div class="two"><div class="mock"><div class="win"><div class="dots"><i></i><i></i><i></i><span>'+E(m[0])+'</span></div>'+m[1].map((c,k)=>'<div class="chip'+(k===m[2]?' hi':'')+'">'+E(c)+'</div>').join('')+'</div></div><div class="grid">'+box('Dùng để',s.use,'teal')+box('Khi nào dùng',s.when,'gray')+box('Lưu ý',s.tip,'amber')+'</div></div>'},
map(){const L=[['Danh sách phiên','Mỗi việc một phiên, bấm để quay lại'],['Ô nhập tin nhắn','Nói việc cần làm bằng tiếng Việt'],['Đính kèm','Dán ảnh, file Excel, PDF cho Claude đọc'],['Dấu / (gạch chéo)','Gọi kỹ năng làm sẵn: Word, Excel'],['Chế độ quyền','Chọn Claude hỏi anh nhiều hay ít'],['Nút dừng','Dừng ngay khi Claude làm sai hướng']];
 return '<h2>Bản đồ giao diện: 6 khu vực cần biết</h2><p class="sub">Hình minh hoạ, giao diện thật trên máy có thể khác đôi chút</p><div class="two"><div class="mock"><div class="win"><div class="chip hi">1  Phiên: Giá thành</div><div class="chip">Phiên: Marketing</div><div class="bub u" style="max-width:none;color:#fff;margin:8px 0">Lập bảng giá thành bánh tortillas</div><div class="chip">2  Nhập việc cần làm…</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip" style="margin:0">3  Đính kèm</span><span class="chip" style="margin:0">4  /</span><span class="chip hi" style="margin:0">5  Hỏi từng việc</span><span class="chip" style="margin:0;background:#A32D2D;color:#fff">6  Dừng</span></div></div></div><div class="rows">'+L.map((l,k)=>'<div class="row"><span class="n">'+(k+1)+'</span><div><b style="display:block">'+l[0]+'</b><span class="d">'+l[1]+'</span></div></div>').join('')+'</div></div>'},
quiz_q(s){const qi=quizzes.indexOf(s),done=store.get('quiz'+qi);
 return '<div class="kick">Câu hỏi nhanh</div><div class="q">'+E(s.q)+'</div><div id="opts">'+s.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="n">'+'ABC'[k]+'</span>'+E(o)+'</button>').join('')+'</div><div class="why" id="why"><b>Vì sao: </b>'+E(s.why)+'</div><p><button id="retry" style="display:none">Làm lại</button></p>'},
exercise_q(s){const key='ex'+s.ord;
 return '<h2>'+E(s.title)+'</h2><p class="sub">Gõ vào các ô, bài làm được lưu trên máy này. Xong bấm xem đáp án gợi ý.</p><div class="bad"><b style="color:var(--redd)">Yêu cầu chưa tốt: </b><i>'+E(s.bad)+'</i></div>'+['Mục tiêu','Ai đọc','Kết quả','Hạn chót','Ràng buộc'].map((f,k)=>'<div class="field"><b>'+f+'</b><div><textarea data-k="'+k+'" placeholder="Gõ vào đây…">'+E(store.get(key+'_'+k)||'')+'</textarea><div class="hint" data-h="'+k+'"><b>Gợi ý: </b>'+E(s.ans[k])+'</div></div></div>').join('')+'<p><button id="showAns">Xem đáp án gợi ý</button></p>'}
};
function updScore(){let ok=0,dn=0;quizzes.forEach((q,i)=>{const v=store.get('quiz'+i);if(v!==null){dn++;if(v==='1')ok++}});document.getElementById('score').textContent='Câu hỏi nhanh: '+ok+' đúng / '+dn+' đã làm / '+quizzes.length}
function wire(s){
 if(s.t==='quiz_q'){const qi=quizzes.indexOf(s),opts=A.querySelectorAll('.opt'),why=A.querySelector('#why'),rt=A.querySelector('#retry');
  const lock=k=>{opts.forEach((b,j)=>{b.disabled=true;if(j===s.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});why.classList.add('show');rt.style.display='inline-block'};
  const prev=store.get('quizpick'+qi);if(prev!==null)lock(+prev);
  opts.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;store.set('quiz'+qi,k===s.ans?'1':'0');store.set('quizpick'+qi,String(k));lock(k);updScore()});
  rt.onclick=()=>{store.del('quiz'+qi);store.del('quizpick'+qi);updScore();render()}}
 if(s.t==='exercise_q'){const key='ex'+s.ord;A.querySelectorAll('textarea').forEach(t=>t.oninput=()=>store.set(key+'_'+t.dataset.k,t.value));
  A.querySelector('#showAns').onclick=()=>{A.querySelectorAll('.hint').forEach(h=>h.classList.toggle('show'))}}
}
function render(){const s=screens[cur];const saved=(!/quiz|exercise/.test(s.t))?store.get('edit'+cur):null;
 A.innerHTML=saved||R[s.t](s);A.contentEditable=edit&&!/quiz|exercise/.test(s.t)?'true':'false';wire(s);
 document.getElementById('pg').textContent=(cur+1)+' / '+screens.length;document.querySelector('#bar i').style.width=((cur+1)/screens.length*100)+'%';
 document.title=(s.title||s.q||'Làm chủ Claude trong công việc');window.scrollTo(0,0);updScore()}
A.addEventListener('input',()=>{if(edit)store.set('edit'+cur,A.innerHTML)});
document.getElementById('bPrev').onclick=()=>goto(cur-1);document.getElementById('bNext').onclick=()=>goto(cur+1);
document.addEventListener('keydown',e=>{if(/textarea|input/i.test(document.activeElement.tagName)||edit)return;if(e.key==='ArrowRight')goto(cur+1);if(e.key==='ArrowLeft')goto(cur-1)});
const toc=document.getElementById('toc');
document.getElementById('bToc').onclick=()=>{let h='';let last=0;screens.forEach((s,i)=>{if(s.t==='divider'||i===0){h+='<h3>'+(i===0?'Phần 1: '+MODS[0][0]:'Phần '+s.mod+': '+E(s.title))+'</h3>'}h+='<a onclick="toc.classList.remove(\'show\');goto('+i+')">'+(i+1)+'. '+E(s.title||s.q||(s.t==='cover'?'Trang bìa':s.t==='agenda'?'Bản đồ khoá học':'Bản đồ giao diện'))+'</a>'});document.getElementById('tocList').innerHTML=h;toc.classList.add('show')};
document.getElementById('bClose').onclick=()=>toc.classList.remove('show');
const be=document.getElementById('bEdit');be.onclick=()=>{edit=!edit;be.textContent='Sửa chữ: '+(edit?'bật':'tắt');be.classList.toggle('on',edit);render()};
const br=document.getElementById('bReset');let armed=0;br.onclick=()=>{if(!armed){armed=1;br.textContent='Bấm lần nữa để xoá hết';setTimeout(()=>{armed=0;br.textContent='Khôi phục bản gốc'},4000)}else{armed=0;br.textContent='Khôi phục bản gốc';try{localStorage.clear()}catch(e){}render()}};
let h=1;try{h=parseInt((location.hash||'#1').slice(1),10)}catch(e){}cur=(h>=1&&h<=screens.length)?h-1:0;render();
</script></body></html>
